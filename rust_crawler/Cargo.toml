[package]
name = "baidu_finance_rust"
version = "1.5.0"
edition = "2021"
description = "A股全市场数据采集控制台（百度财经 + 东方财富）"

[[bin]]
name = "baidu_finance_rust"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
eframe = "0.29"
egui = "0.29"
rand = "0.8"
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "cookies", "json", "native-tls", "gzip", "deflate", "brotli", "socks", "multipart"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
urlencoding = "2"
webbrowser = "1"
rfd = "0.15"
winreg = "0.52"
