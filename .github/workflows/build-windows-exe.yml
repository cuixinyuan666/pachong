# GitHub Actions：在 windows-latest 上 cargo 编 Rust GUI exe，打 tag 时发到 Releases
name: Build Windows exe

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo release
        working-directory: rust_crawler
        run: cargo build --release

      - name: Rename exe
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item rust_crawler/target/release/baidu_finance_rust.exe dist/baidu_finance_rust-windows-x64.exe

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: baidu_finance_rust-windows-x64
          path: dist/baidu_finance_rust-windows-x64.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/baidu_finance_rust-windows-x64.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
