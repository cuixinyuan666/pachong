# GitHub Actions：在 windows-latest 上编 pachong.exe，打 tag 或手动触发时发到 Releases
name: Build Windows exe

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: PyInstaller
        run: pyinstaller --noconfirm --clean pachong.spec

      - name: Rename exe
        run: Copy-Item dist/pachong.exe dist/pachong-windows-x64.exe

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pachong-windows-x64
          path: dist/pachong-windows-x64.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/pachong-windows-x64.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
